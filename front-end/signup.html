<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HEYCOUN - 회원가입</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <style>
    :root {
      --deep: #1E1F31; 
      --primary: #6D5DCD;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      background: #FFFFFF; /* 배경색 */
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    .signup-wrapper {
      position: relative;
      z-index: 10;
    }

    .signup-box {
      background: #FFFFFF;
      padding: 50px 60px;
      border-radius: 24px;
      width: 440px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.07);
      border: 1px solid #F0F0F0;
    }

    .logo {
      margin-bottom: 50px; 
    }

    .logo img {
      width: 160px; 
      height: auto;
      display: block;
      margin: 0 auto; 
    }

    .signup-form {
      text-align: left;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 8px;
    }

    .input-group input {
      width: 100%;
      padding: 16px;
      border: 1px solid #E0E0E0;
      border-radius: 12px;
      font-size: 1rem;
      font-family: "Pretendard", sans-serif;
      background-color: #FAFAFA;
      transition: all 0.2s;
    }
    
    .input-group input:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(109, 93, 205, 0.1);
    }

    .signup-button {
      width: 100%;
      padding: 18px;
      margin-top: 20px;
      background: var(--deep);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.1rem;
      font-family: "Pretendard", sans-serif;
      cursor: pointer;
      transition: transform 0.1s, background 0.3s;
    }

    .signup-button:hover {
      background: #333452;
      transform: translateY(-2px); 
    }
    
    .bg-character {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 180px;
      z-index: 5;
      opacity: 0.9;
    }

  </style>
</head>
<body>

  <img src="images/signup_logo.png" alt="캐릭터" class="bg-character">

  <div class="signup-wrapper">
    <div class="signup-box">
      <div class="logo">
        <img src="images/logo.png" alt="HEYCOUN">
      </div>

      <form class="signup-form" onsubmit="return handleSignup(event)">
        <div class="input-group">
          <label for="username">아이디</label>
          <input type="text" id="username" placeholder="아이디를 입력해주세요" required>
        </div>
        
        <div class="input-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호를 입력해주세요" required>
        </div>

        <button type="submit" class="signup-button">시작하러 가볼까요?</button>
      </form>
    </div>
  </div>

  <script>
    function handleSignup(event) {
      event.preventDefault();

      const username = document.getElementById('username').value;

      if(username) {
        localStorage.setItem('isHeycounLoggedIn', 'true');
        alert(`환영합니다, ${username}님!\n헤이!포트폴과 함께 포트폴리오를 완성해보세요.`);
        location.href = 'home.html';
      }
    }
  </script>

</body>
</html>
