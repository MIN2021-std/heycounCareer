<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HEYCOUN - 홈</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  
  </head>
<body>

  <header class="main-header">
    <div class="logo">
        <img src="images/logo.png" alt="HEYCOUN">
    </div>
    <div class="user-menu">
      <span class="welcome-msg" id="header-username">반가워요!</span>
      <a href="/intro" class="logout-link" onclick="handleLogout()">로그아웃</a>
    </div>
  </header>

  <main class="main-wrapper">

    <section class="top-section">
      <a href="chat.html" class="action-card">
        <h3>AI와 채팅하러 가기</h3>
        <div class="card-icon">
          <img src="images/chat_icon.png" alt="Chat">
        </div>
      </a>
      <a href="paragraphs.html" class="action-card">
        <h3>나의 문단들 만들러가기</h3>
        <div class="card-icon">
          <img src="images/write_icon.png" alt="Write">
        </div>
      </a>
      <div class="guide-section">
        <div class="guide-header">
          <span>이용 가이드</span>
          <a href="guide.html" id="guide-view-link">전체보기 &gt;</a>
        </div>
        <nav class="guide-nav">
          <a href="#" class="guide-item">
            <span class="guide-icon">🗓️</span>캘린더
          </a>
          <a href="#" class="guide-item">
            <span class="guide-icon">👥</span>커뮤니티
          </a>
          <a href="#" class="guide-item">
            <span class="guide-icon">👤</span>마이페이지
          </a>
        </nav>
      </div>
    </section>

    <section class="content-section">
      <div class="section-header">
        <h2>📄 나의 프로젝트</h2>
        <button class="btn-add" id="open-project-modal">＋</button>
      </div>
      <div class="project-list" id="project-list"></div>
    </section>

    <section class="content-section">
      <div class="section-header">
        <h2>⚙️ 나의 역량</h2>
        <button class="btn-add" id="open-skill-modal">＋</button>
      </div>
      <div class="skill-container" id="skill-container"></div>
    </section>

    <section class="content-section">
      <div class="section-header">
        <h2>📜 자격증</h2>
        <button class="btn-add" id="open-cert-modal">＋</button>
      </div>
      <div class="cert-list" id="cert-list"></div>
    </section>

  </main>

  <div class="modal-overlay" id="project-modal-overlay">
    <div class="modal-content">
        <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        <h2>📄 프로젝트 추가</h2>
        <p class="modal-subtitle">내가 했던 모든 활동들을 기록해보세요</p>
        <form>
            <div class="form-group">
                <div class="form-group-header">
                  <label>구분</label>
                  <button type="button" id="add-category-btn">+ 구분 추가</button>
                </div>
                <div class="radio-group" id="category-group">
                    <input type="radio" id="cat-school" name="category" value="school" checked>
                    <label for="cat-school" class="radio-label">학교</label>
                    <input type="radio" id="cat-external" name="category" value="external">
                    <label for="cat-external" class="radio-label">대외활동</label>
                </div>
            </div>
            <div class="form-group">
                <label for="project-name">프로젝트명</label>
                <input type="text" id="project-name" class="full-width-input" placeholder="예: 식품 알러지 홍보 프로젝트">
            </div>
            <div class="form-group">
                <div class="form-group-header">
                  <label>담당 파트</label>
                  <button type="button" id="add-part-btn">+ 파트 추가</button>
                </div>
                <div class="radio-group" id="part-group"></div>
            </div>
            <button type="submit" class="modal-submit-btn">추가하기</button>
        </form>
    </div>
    </div>
    <div class="modal-overlay" id="cert-modal-overlay">
      <div class="modal-content">
        <button class="modal-close-btn" id="cert-modal-close-btn">&times;</button>
        <h2>📜 자격증 추가</h2>
        <p class="modal-subtitle">취득한 자격증 정보를 입력해주세요</p>

        <form>
          <div class="form-group">
            <label>취득일자</label>
            <div class="date-inputs">
              <input type="text" placeholder="YYYY" class="date-input"> 년
              <input type="text" placeholder="MM" class="date-input"> 월
              <input type="text" placeholder="DD" class="date-input"> 일
            </div>
          </div>
          <div class="form-group">
            <label for="cert-name">자격증 명</label>
            <input type="text" id="cert-name" class="full-width-input" placeholder="예: 정보처리기사">
          </div>
          <button type="submit" class="modal-submit-btn">추가하기</button>
        </form>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="skill-modal-overlay">
    <div class="modal-content" style="width: 600px;">
      <button class="modal-close-btn" id="skill-modal-close-btn">&times;</button>
      <h2>⚙️ 역량 선택</h2>
      <p class="modal-subtitle">사용 가능한 툴이나 언어를 선택해주세요</p>

      <div class="skill-icon-grid">
        <div class="skill-icon-item"><img src="images/icon_pp.png"></div>
        <div class="skill-icon-item"><img src="images/icon_excel.png"></div>
        <div class="skill-icon-item"><img src="images/icon_html.png"></div>
        <div class="skill-icon-item"><img src="images/icon_cpp.png"></div>
        <div class="skill-icon-item"><img src="images/icon_figma.png"></div>
        <div class="skill-icon-item"><img src="images/icon_ai.png"></div>
        <div class="skill-icon-item"><img src="images/icon_ps.png"></div>
        <div class="skill-icon-item"><img src="images/icon_python.png"></div>
        <div class="skill-icon-item"><img src="images/icon_react.png"></div>
        <div class="skill-icon-item"><img src="images/icon_java.png"></div>
      </div>
      <button type="button" class="modal-submit-btn" id="skill-submit-btn">선택 완료</button>
    </div>
  </div>

  <script>
      // 구분/파트 동적 추가용 배열
      let categories = ['학교', '대외활동'];
      let parts = ['기획', '디자인', '프론트엔드'];

      // 구분/파트 렌더 함수
      function renderCategories() {
        const group = document.getElementById('category-group');
        group.innerHTML = '';
        categories.forEach((cat, idx) => {
          group.innerHTML += `<input type="radio" id="cat-${idx}" name="category" value="${cat}" ${idx===0?'checked':''}>
          <label for="cat-${idx}" class="radio-label">${cat}</label>`;
        });
      }
      function renderParts() {
        const group = document.getElementById('part-group');
        group.innerHTML = '';
        parts.forEach((part, idx) => {
          group.innerHTML += `<input type="checkbox" id="part-${idx}" name="part" value="${part}">
          <label for="part-${idx}" class="radio-label">${part}</label>`;
        });
      }

      // 구분 추가 버튼
      document.getElementById('add-category-btn').onclick = function() {
        const newCat = prompt('새 구분명을 입력하세요');
        if(newCat && !categories.includes(newCat)) {
          categories.push(newCat);
          renderCategories();
        }
      };
      // 파트 추가 버튼 (버그 수정: parts 배열에만 추가)
      document.getElementById('add-part-btn').onclick = function() {
        const newPart = prompt('새 파트명을 입력하세요');
        if(newPart && !parts.includes(newPart)) {
          parts.push(newPart);
          renderParts();
        }
      };

      // 모달 열릴 때마다 구분/파트 렌더
      document.getElementById('open-project-modal').onclick = function() {
        renderCategories();
        renderParts();
        document.getElementById('project-modal-overlay').classList.add('is-active');
      };
    window.onload = function() {
      const savedName = localStorage.getItem('username') || '김서현'; 
      document.getElementById('header-username').innerText = `${savedName}님, 안녕하세요!`;
      renderAll();
    };

    function handleLogout() {
      localStorage.removeItem('isHeycounLoggedIn');
      alert('로그아웃 되었습니다.');
      location.href = '/';
    }

    // 데이터 저장
    let projects = JSON.parse(localStorage.getItem('projects') || '[]');
    let skills = JSON.parse(localStorage.getItem('skills') || '[]');
    let certs = JSON.parse(localStorage.getItem('certs') || '[]');

    // 렌더 함수
    function renderProjects() {
      const list = document.getElementById('project-list');
      list.innerHTML = '';
      projects.forEach(proj => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.innerHTML = `<div class="proj-info">
          <span class="proj-date">${proj.date}</span>
          <span class="proj-cat">${proj.cat}</span>
          <span class="proj-title">${proj.title}</span>
        </div>
        <div class="proj-tags">${proj.tags.map(tag => `<span class='tag'>${tag}</span>`).join('')}</div>`;
        list.appendChild(card);
      });
    }
    function renderSkills() {
      const list = document.getElementById('skill-container');
      list.innerHTML = '';
      skills.forEach(skill => {
        const item = document.createElement('div');
        item.className = 'skill-item';
        item.innerHTML = `<img src="${skill.icon}" alt="${skill.name}">`;
        list.appendChild(item);
      });
    }
    function renderCerts() {
      const list = document.getElementById('cert-list');
      list.innerHTML = '';
      certs.forEach(cert => {
        const card = document.createElement('div');
        card.className = 'cert-card';
        card.innerHTML = `<span class="cert-title">${cert.name}</span><span class="cert-date">${cert.date}</span>`;
        list.appendChild(card);
      });
    }
    function renderAll() {
      renderProjects();
      renderSkills();
      renderCerts();
    }

    // 모달 세팅
    function setupModal(triggerId, overlayId, closeId) {
      const trigger = document.getElementById(triggerId);
      const overlay = document.getElementById(overlayId);
      const close = document.getElementById(closeId);
      if(trigger && overlay) {
        trigger.addEventListener('click', () => overlay.classList.add('is-active'));
      }
      if(close && overlay) {
        close.addEventListener('click', () => overlay.classList.remove('is-active'));
      }
      if(overlay) {
        overlay.addEventListener('click', (e) => {
          if(e.target === overlay) overlay.classList.remove('is-active');
        });
      }
    }
    setupModal('open-project-modal', 'project-modal-overlay', 'modal-close-btn');
    setupModal('open-skill-modal', 'skill-modal-overlay', 'skill-modal-close-btn');

    // 자격증 +버튼 클릭 시 모달 열기
    document.getElementById('open-cert-modal').onclick = function() {
      document.getElementById('cert-modal-overlay').classList.add('is-active');
    };

    // 프로젝트 추가
    document.querySelector('#project-modal-overlay form').onsubmit = function(e) {
      e.preventDefault();
      const date = this.querySelector('#project-name').value ? new Date().toISOString().slice(0,7).replace('-', '.') : '';
      const cat = this.querySelector('input[name="category"]:checked').nextElementSibling.innerText;
      const title = this.querySelector('#project-name').value;
      const tags = Array.from(this.querySelectorAll('input[name="part"]:checked')).map(i => i.nextElementSibling.innerText);
      if(title) {
        projects.push({date, cat, title, tags});
        localStorage.setItem('projects', JSON.stringify(projects));
        renderProjects();
        document.getElementById('project-modal-overlay').classList.remove('is-active');
        this.reset();
      }
    };

    // 자격증 추가
    document.querySelector('#cert-modal-overlay form').onsubmit = function(e) {
      e.preventDefault();
      const year = this.querySelector('.date-input[placeholder="YYYY"]').value;
      const month = this.querySelector('.date-input[placeholder="MM"]').value;
      const day = this.querySelector('.date-input[placeholder="DD"]').value;
      const name = this.querySelector('#cert-name').value;
      const date = `${year}.${month}.${day}`;
      if(name && year && month && day) {
        certs.push({name, date});
        localStorage.setItem('certs', JSON.stringify(certs));
        renderCerts();
        document.getElementById('cert-modal-overlay').classList.remove('is-active');
        this.reset();
      }
    };

    // 역량 추가
    document.getElementById('skill-submit-btn').onclick = function() {
      const icons = Array.from(document.querySelectorAll('.skill-icon-item.selected')).map(i => {
        const img = i.querySelector('img');
        return {icon: img.src, name: img.alt};
      });
      skills = icons;
      localStorage.setItem('skills', JSON.stringify(skills));
      renderSkills();
      document.getElementById('skill-modal-overlay').classList.remove('is-active');
    };

    // 아이콘 선택
    document.querySelectorAll('.skill-icon-item').forEach(icon => {
      icon.onclick = function() { icon.classList.toggle('selected'); };
    });
  </script>
</body>
</html>
