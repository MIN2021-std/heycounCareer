<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HEYCOUN - 홈</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <style>
    :root {
      --deep: #1E1F31;
      --accent: #7460F0;
      --bg-light-gray: #F8F9FA;
      --border-gray: #E0E0E0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      color: var(--deep);
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .main-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 60px;
      border-bottom: 1px solid var(--border-gray);
    }
    
    .main-header .logo {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--deep);
    }

    .main-header .logout-link {
      font-size: 0.9rem;
      font-weight: 500;
      color: #666;
    }

    .main-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 60px;
    }

    .top-section {
      display: grid;
      grid-template-columns: 1fr 1fr 300px;
      gap: 20px;
      margin-bottom: 40px;
    }

    .info-card {
      background: var(--bg-light-gray);
      border-radius: 20px;
      padding: 24px;
      display: flex;
      align-items: center;
      font-size: 1.5rem;
      font-weight: 700;
    }
    
    .info-card.chat-card {
      background: #EBE9FD;
      color: var(--deep);
    }

    .info-card .icon {
      font-size: 2rem;
      margin-right: 16px;
    }

    .guide-section {
      background: var(--bg-light-gray);
      border-radius: 20px;
      padding: 24px;
    }
    
    .guide-link {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      margin-bottom: 20px;
    }
    
    .guide-nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      text-align: center;
      gap: 10px;
    }
    
    .guide-nav-item {
      font-size: 0.85rem;
      color: #555;
    }

    .guide-nav-item .icon-placeholder {
      display: block;
      width: 48px;
      height: 48px;
      background: #E0E0E0;
      border-radius: 20%;
      margin: 0 auto 8px auto;
      line-height: 48px;
      font-size: 1.5rem;
    }

    .content-section {
      background: var(--bg-light-gray);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
    }
    
    .content-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    
    .content-section-header h2 {
      font-size: 1.25rem;
      display: flex;
      align-items: center;
    }

    .content-section-header .icon {
      font-size: 1.5rem;
      margin-right: 8px;
    }

    .content-section-header .btn-add {
      font-size: 1.5rem;
      font-weight: 600;
      cursor: pointer;
    }

    .project-list-item {
      display: grid;
      grid-template-columns: 100px 100px 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 12px 0;
      font-size: 0.95rem;
    }
    
    .project-list-item:not(:last-child) {
      border-bottom: 1px solid #E0E0E0;
    }

    .project-list-item .date {
      color: #555;
    }
    
    .project-list-item .category {
      font-weight: 600;
    }
    
    .project-list-item .title {
      font-weight: 500;
    }

    .project-tags {
      display: flex;
      gap: 6px;
    }
    
    .tag {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--deep);
    }
    .tag-purple { background: #EBE9FD; }
    .tag-blue { background: #E0F2FE; }
    .tag-green { background: #D1FAE5; }
    .tag-yellow { background: #FEF3C7; }

    .skill-icons {
      display: flex;
      gap: 30px;
    }
    
    .skill-icons img {
      width: 48px;
      height: 48px;
      object-fit: contain;
    }

    .cert-list-item {
      display: grid;
      grid-template-columns: 120px 1fr;
      padding: 12px 0;
      font-size: 0.95rem;
    }

    .cert-list-item:not(:last-child) {
      border-bottom: 1px solid #E0E0E0;
    }
    
    .cert-list-item .date {
      color: #555;
    }
    
    .cert-list-item .title {
      font-weight: 500;
    }

    .modal-overlay {
    position: fixed; 
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .modal-overlay.is-active {
    visibility: visible;
    opacity: 1;
    }

    .modal-content {
    background: #FFFFFF;
    padding: 24px 30px;
    border-radius: 20px;
    width: 630px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    position: relative;
    
    transform: translateY(20px);
    transition: transform 0.3s ease;
    }

    .modal-overlay.is-active .modal-content {
    transform: translateY(0);
    }

    .modal-content h2 {
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    }

    .modal-content h2 .icon {
    font-size: 1.5rem;
    margin-right: 8px;
    }

    .modal-subtitle {
    font-size: 0.9rem;
    color: #666;
    margin-bottom: 24px;
    }

    .modal-close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    font-size: 2rem;
    color: #888;
    cursor: pointer;
    line-height: 1;
    }

    .modal-form .form-group {
    margin-bottom: 20px;
    }

    .modal-form label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    margin-bottom: 10px;
    }

    .date-inputs {
    display: flex;
    align-items: center;
    gap: 8px;
    }

    .date-inputs .date-input {
    width: 80px;
    padding: 10px;
    border: 1px solid var(--border-gray);
    border-radius: 8px;
    text-align: center;
    }

    .full-width-input {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border-gray);
    border-radius: 8px;
    }

    .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    }

    .radio-group input[type="radio"] {
    display: none; 
    }

    .radio-group .radio-label {
    padding: 8px 14px;
    border: 1px solid var(--border-gray);
    border-radius: 999px;
    font-size: 0.9rem;
    font-weight: 500;
    color: #555;
    cursor: pointer;
    transition: all 0.2s ease;
    }

    .radio-group input[type="radio"]:checked + .radio-label {
    background: #EBE9FD;
    border-color: #C0B8F9;
    color: var(--deep);
    font-weight: 600;
    }

    .modal-submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--deep);
    color: #FFFFFF;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
    }

    .modal-submit-btn:hover {
    background: #333;
    }

    .form-group-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    }

    .form-group-header label {
    margin-bottom: 0;
    }

    .btn-add-option {
    background: none;
    border: none;
    color: #888;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    }

    .modal-content.small-modal {
    width: 380px;
    }

    .color-palette {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    }

    .color-dot {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    transition: border-color 0.2s;
    box-sizing: border-box;
    }

    .color-dot:hover,
    .color-dot.selected { 
    border-color: #E0E0E0;
    }

    .modal-content.small-modal .modal-submit-btn,
    #cert-modal-overlay .modal-submit-btn,
    #skill-modal-overlay .modal-submit-btn {
    width: auto;
    padding: 12px 40px; 
    display: block;
    margin: 20px auto 0 auto; 
    }

    .modal-content.small-modal h2 {
    display: flex;
    align-items: center;
    }

    .modal-content.small-modal h2 .icon {
    font-size: 1.25rem;
    margin-right: 8px;
    }

    .skill-icon-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 20px;
    padding: 20px 0;
    }

    .skill-icon-item {
    background: var(--bg-light-gray);
    border: 1px solid var(--border-gray);
    border-radius: 12px;
    padding: 24px; 
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
    }

    .skill-icon-item img {
    width: 50px; 
    height: 50px;
    object-fit: contain;
    }

    .skill-icon-item:hover {
    border-color: #AAAAAA;
    background: #F1F3F5;
    }

    .skill-icon-item.selected {
    border-color: var(--accent); 
    background: #EBE9FD;
    }
  </style>
</head>

<script>
  const API_URL = 'http://localhost:8000/api';
  const openProjectModalBtn = document.getElementById('open-project-modal');
  const projectModalOverlay = document.getElementById('project-modal-overlay');
  const closeProjectModalBtn = document.getElementById('modal-close-btn');
  const projectForm = document.getElementById('project-form');

  const addOptionButtons = document.querySelectorAll('.btn-add-option'); 
  const addCategoryModalOverlay = document.getElementById('add-category-modal'); 
  const closeCategoryModalBtn = addCategoryModalOverlay ? addCategoryModalOverlay.querySelector('[data-modal-close="add-category-modal"]') : null; 
  const saveCategoryModalBtn = document.getElementById('save-new-item-btn'); 
  const addCategoryModalTitle = document.getElementById('add-category-modal-title');

  // 파트 색상 매핑
  const partColors = {
    '기획': 'tag-purple',
    '디자인': 'tag-blue',
    '프론트엔드': 'tag-green',
    '백엔드': 'tag-yellow'
  };

  // 프로젝트 로드
  async function loadProjects() {
    try {
      const token = localStorage.getItem('access_token');
      if (!token) return;
      
      const response = await fetch(`${API_URL}/projects/`, {
        headers: { 'Authorization': `Token ${token}` }
      });
      
      if (response.ok) {
        const projects = await response.json();
        const projectList = document.querySelector('.project-list');
        projectList.innerHTML = '';
        
        projects.forEach(project => {
          const projectItem = document.createElement('div');
          projectItem.className = 'project-list-item';
          
          const date = `${project.year}.${String(project.month).padStart(2, '0')}`;
          const parts = Array.isArray(project.parts) ? project.parts : [project.parts];
          
          // parts를 처리 (객체 또는 문자열 둘 다 지원)
          const partTags = parts.map(part => {
            if (typeof part === 'object' && part.name) {
              return `<span class="tag" style="background-color: ${part.color || '#EBE9FD'}">${part.name}</span>`;
            } else {
              return `<span class="tag ${partColors[part] || 'tag-purple'}">${part}</span>`;
            }
          }).join('');
          
          projectItem.innerHTML = `
            <span class="date">${date}</span>
            <span class="category">${project.category}</span>
            <span class="title">${project.title}</span>
            <div class="project-tags">
              ${partTags}
            </div>
          `;
          
          projectList.appendChild(projectItem);
        });
      }
    } catch (error) {
      console.error('Error loading projects:', error);
    }
  }

  // 프로젝트 폼 제출
  if (projectForm) {
    projectForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const year = document.getElementById('project-year').value;
      const month = document.getElementById('project-month').value;
      const title = document.getElementById('project-name').value;
      const category = document.querySelector('input[name="category"]:checked').value;
      
      const checkedParts = Array.from(document.querySelectorAll('input[name="part"]:checked'))
        .map(input => {
          const label = document.querySelector(`label[for="${input.id}"]`);
          const bgColor = label ? label.style.backgroundColor : '';
          return {
            name: input.value,
            color: bgColor || partColors[input.value] || '#EBE9FD'
          };
        });
      
      if (!year || !month || !title || checkedParts.length === 0) {
        alert('모든 필드를 입력해주세요.');
        return;
      }
      
      try {
        const token = localStorage.getItem('access_token');
        const response = await fetch(`${API_URL}/projects/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Token ${token}`
          },
          body: JSON.stringify({
            year: parseInt(year),
            month: parseInt(month),
            title: title,
            category: category,
            parts: checkedParts
          })
        });
        
        if (response.ok) {
          projectModalOverlay.classList.remove('is-active');
          projectForm.reset();
          loadProjects();
        } else {
          alert('프로젝트 추가에 실패했습니다.');
        }
      } catch (error) {
        console.error('Error adding project:', error);
        alert('오류가 발생했습니다.');
      }
    });
  } 

  if (openProjectModalBtn) {
    openProjectModalBtn.addEventListener('click', () => {
      projectModalOverlay.classList.add('is-active'); 
    });
  }

  if (closeProjectModalBtn) {
    closeProjectModalBtn.addEventListener('click', () => {
      projectModalOverlay.classList.remove('is-active'); 
    });
  }
  
  if (projectModalOverlay) {
    projectModalOverlay.addEventListener('click', (event) => {
      if (event.target === projectModalOverlay) {
        projectModalOverlay.classList.remove('is-active');
      }
    });
  }

  addOptionButtons.forEach(button => {
    button.addEventListener('click', () => {
      const modalTitle = button.dataset.modalTitle;
      
      projectModalOverlay.classList.remove('is-active');
      
      if (addCategoryModalTitle) {
        addCategoryModalTitle.textContent = modalTitle;
      }
      
      setTimeout(() => {
        addCategoryModalOverlay.classList.add('is-active');
      }, 50); 
    });
  });

  function closeAndReopenFirstModal() {
    addCategoryModalOverlay.classList.remove('is-active');
    
    setTimeout(() => {
      projectModalOverlay.classList.add('is-active');
    }, 50);
  }

  if (closeCategoryModalBtn) {
    closeCategoryModalBtn.addEventListener('click', closeAndReopenFirstModal);
  }

  if (saveCategoryModalBtn) {
    saveCategoryModalBtn.addEventListener('click', () => {
      const newItemName = document.getElementById('new-item-name').value.trim();
      const selectedColorDot = document.querySelector('.color-dot.selected');
      const selectedColor = selectedColorDot ? selectedColorDot.dataset.color : '#F8BBD0';
      const modalTitle = addCategoryModalTitle.textContent;
      
      if (!newItemName) {
        alert('이름을 입력해주세요.');
        return;
      }
      
      if (modalTitle === '파트 추가') {
        // 파트 추가
        const radioGroup = document.querySelector('#project-form .form-group:last-of-type .radio-group');
        const newPartId = `part-${Date.now()}`;
        
        // 새로운 체크박스 생성
        const newCheckbox = document.createElement('input');
        newCheckbox.type = 'checkbox';
        newCheckbox.id = newPartId;
        newCheckbox.name = 'part';
        newCheckbox.value = newItemName;
        
        const newLabel = document.createElement('label');
        newLabel.htmlFor = newPartId;
        newLabel.className = 'radio-label';
        newLabel.style.backgroundColor = selectedColor;
        newLabel.textContent = newItemName;
        
        radioGroup.appendChild(newCheckbox);
        radioGroup.appendChild(newLabel);
        
        // 색상 매핑에도 추가
        partColors[newItemName] = `tag-custom-${Date.now()}`;
      } else if (modalTitle === '구분 추가') {
        // 구분 추가
        const radioGroup = document.querySelector('#project-form .form-group:first-of-type .radio-group');
        const newCatId = `cat-${Date.now()}`;
        
        const newRadio = document.createElement('input');
        newRadio.type = 'radio';
        newRadio.id = newCatId;
        newRadio.name = 'category';
        newRadio.value = newItemName;
        
        const newLabel = document.createElement('label');
        newLabel.htmlFor = newCatId;
        newLabel.className = 'radio-label';
        newLabel.textContent = newItemName;
        
        radioGroup.appendChild(newRadio);
        radioGroup.appendChild(newLabel);
      }
      
      // 입력 필드 초기화
      document.getElementById('new-item-name').value = '';
      document.querySelectorAll('.color-dot').forEach(dot => dot.classList.remove('selected'));
      
      closeAndReopenFirstModal();
    });
  }
  
  // 색상 선택 기능
  document.querySelectorAll('.color-dot').forEach(dot => {
    dot.addEventListener('click', () => {
      document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
      dot.classList.add('selected');
    });
  });

  if (addCategoryModalOverlay) {
    addCategoryModalOverlay.addEventListener('click', (event) => {
      if (event.target === addCategoryModalOverlay) {
        closeAndReopenFirstModal();
      }
    });
  }
  const openCertModalBtn = document.getElementById('open-cert-modal');
  const certModalOverlay = document.getElementById('cert-modal-overlay');
  const closeCertModalBtn = document.getElementById('cert-modal-close-btn');

  if (openCertModalBtn) {
    openCertModalBtn.addEventListener('click', () => {
      certModalOverlay.classList.add('is-active'); 
    });
  }

  if (closeCertModalBtn) {
    closeCertModalBtn.addEventListener('click', () => {
      certModalOverlay.classList.remove('is-active');
    });
  }
  
  if (certModalOverlay) {
    certModalOverlay.addEventListener('click', (event) => {
      if (event.target === certModalOverlay) {
        certModalOverlay.classList.remove('is-active');
      }
    });
  }
  const openSkillModalBtn = document.getElementById('open-skill-modal');
  const skillModalOverlay = document.getElementById('skill-modal-overlay');
  const closeSkillModalBtn = document.getElementById('skill-modal-close-btn');
  const skillSubmitBtn = document.getElementById('skill-submit-btn');

  // 스킬 이름과 이미지 매핑
  const skillImageMap = {
    'PowerPoint': 'icon_pp.png',
    'Excel': 'icon_excel.png',
    'HTML5': 'icon_html.png',
    'C++': 'icon_cpp.png',
    'Figma': 'icon_figma.png',
    'Illustrator': 'icon_ai.png',
    'Photoshop': 'icon_ps.png',
    'Lightroom': 'icon_lr.png',
    'After Effects': 'icon_ae.png',
    'InDesign': 'icon_id.png',
    'Python': 'icon_python.png',
    'React': 'icon_react.png',
    'Java': 'icon_java.png',
    'Swift': 'icon_swift.png',
    'Android': 'icon_android.png'
  };

  // 스킬 로드
  async function loadSkills() {
    try {
      const token = localStorage.getItem('access_token');
      if (!token) return;
      
      const response = await fetch(`${API_URL}/skills/`, {
        headers: { 'Authorization': `Token ${token}` }
      });
      
      if (response.ok) {
        const skills = await response.json();
        const skillIconsContainer = document.querySelector('.skill-icons');
        skillIconsContainer.innerHTML = '';
        
        skills.forEach(skill => {
          const img = document.createElement('img');
          const imageName = skillImageMap[skill.name] || `icon_${skill.name.toLowerCase()}.png`;
          img.src = `/images/${imageName}`;
          img.alt = skill.name;
          skillIconsContainer.appendChild(img);
        });
      }
    } catch (error) {
      console.error('Error loading skills:', error);
    }
  }

  if (openSkillModalBtn) {
    openSkillModalBtn.addEventListener('click', () => {
      skillModalOverlay.classList.add('is-active');
    });
  }

  function closeSkillModal() {
    skillModalOverlay.classList.remove('is-active'); 
  }

  if (closeSkillModalBtn) {
    closeSkillModalBtn.addEventListener('click', closeSkillModal);
  }
  
  if (skillSubmitBtn) {
    skillSubmitBtn.addEventListener('click', async () => {
      const selectedIcons = document.querySelectorAll('.skill-icon-item.selected');
      
      if (selectedIcons.length === 0) {
        alert('스킬을 선택해주세요.');
        return;
      }
      
      try {
        const token = localStorage.getItem('access_token');
        
        for (const icon of selectedIcons) {
          const skillName = icon.dataset.skill;
          await fetch(`${API_URL}/skills/`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Token ${token}`
            },
            body: JSON.stringify({
              name: skillName,
              proficiency: 3
            })
          });
        }
        
        selectedIcons.forEach(icon => icon.classList.remove('selected'));
        closeSkillModal();
        loadSkills();
      } catch (error) {
        console.error('Error saving skills:', error);
        alert('스킬 추가에 실패했습니다.');
      }
    });
  }
  
  if (skillModalOverlay) {
    skillModalOverlay.addEventListener('click', (event) => {
      if (event.target === skillModalOverlay) {
        closeSkillModal();
      }
    });
  }
  
  const skillIcons = document.querySelectorAll('.skill-icon-item');
  if (skillIcons) {
    skillIcons.forEach(icon => {
      icon.addEventListener('click', () => {
        icon.classList.toggle('selected');
      });
    });
  }

  // 자격증 관련
  const certForm = document.getElementById('cert-form');

  async function loadCertifications() {
    try {
      const token = localStorage.getItem('access_token');
      if (!token) return;
      
      const response = await fetch(`${API_URL}/certifications/`, {
        headers: { 'Authorization': `Token ${token}` }
      });
      
      if (response.ok) {
        const certs = await response.json();
        const certList = document.querySelector('.cert-list');
        certList.innerHTML = '';
        
        certs.forEach(cert => {
          const certItem = document.createElement('div');
          certItem.className = 'cert-list-item';
          
          const issueDate = new Date(cert.issue_date);
          const dateStr = `${issueDate.getFullYear()}.${String(issueDate.getMonth() + 1).padStart(2, '0')}.${String(issueDate.getDate()).padStart(2, '0')}`;
          
          certItem.innerHTML = `
            <span class="date">${dateStr}</span>
            <span class="title">${cert.title}</span>
          `;
          
          certList.appendChild(certItem);
        });
      }
    } catch (error) {
      console.error('Error loading certifications:', error);
    }
  }

  if (certForm) {
    certForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const year = document.getElementById('cert-year').value;
      const month = document.getElementById('cert-month').value;
      const day = document.getElementById('cert-day').value;
      const title = document.getElementById('cert-name').value;
      
      if (!year || !month || !day || !title) {
        alert('모든 필드를 입력해주세요.');
        return;
      }
      
      try {
        const token = localStorage.getItem('access_token');
        const issueDate = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        const response = await fetch(`${API_URL}/certifications/`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Token ${token}`
          },
          body: JSON.stringify({
            title: title,
            issuer: '-',
            issue_date: issueDate
          })
        });
        
        if (response.ok) {
          document.getElementById('cert-modal-overlay').classList.remove('is-active');
          certForm.reset();
          loadCertifications();
        } else {
          alert('자격증 추가에 실패했습니다.');
        }
      } catch (error) {
        console.error('Error adding certification:', error);
        alert('오류가 발생했습니다.');
      }
    });
  }

  // 페이지 로드 시 모든 데이터 불러오기
  window.addEventListener('DOMContentLoaded', () => {
    loadProjects();
    loadSkills();
    loadCertifications();
  });
</script>
</body>
</html>
