<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HEYCOUN - 나의 문단들</title>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet" />
  <style>
    :root {
      --deep: #1E1F31;
      --accent: #7460F0;
      --bg-light-gray: #F8F9FA;
      --border-gray: #E0E0E0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Pretendard", "Noto Sans KR", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: #FFFFFF;
      -webkit-font-smoothing: antialiased;
      color: var(--deep);
      position: relative; 
      overflow-x: hidden;
      min-height: 100vh;
      padding-bottom: 90px; 
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .page-wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 60px;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .page-header h1 {
      font-size: 2.5rem;
      font-weight: 800;
    }

    .home-button {
      font-size: 0.95rem;
      color: #555;
      text-decoration: none;
      padding: 8px 10px;
      border-radius: 8px;
      transition: background 0.2s;
      font-weight: 600;
    }

    .home-button:hover {
      background: var(--bg-light-gray);
    }

    .category-nav {
      display: flex;
      gap: 30px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-gray);
      padding-bottom: 20px;
    }
    
    .category-nav a {
      font-size: 1.1rem;
      font-weight: 600;
      color: #AAAAAA;
      padding: 4px;
      transition: color 0.2s;
    }
    
    .category-nav a:hover {
        color: var(--accent);
    }

    .category-nav a.is-active {
      color: var(--accent);
      font-weight: 800; 
    }

    .search-bar {
      position: relative;
      width: 100%;
      max-width: 600px; 
      margin: 0 auto 40px auto; 
    }
    
    .search-bar input {
      width: 100%;
      padding: 14px 45px 14px 24px;
      border: 1px solid var(--border-gray);
      border-radius: 999px;
      font-size: 1rem;
    }
    
    .search-bar input:focus {
      outline: none;
      border-color: var(--deep);
    }

    .search-bar button {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.5rem;
      color: #888;
    }

    .paragraph-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr); 
      gap: 20px;
    }

    .paragraph-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 420px;
      border: 2px solid transparent;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s;
      cursor: pointer;
    }
    .paragraph-card:hover {
      border-color: #7460F0;
      box-shadow: 0 12px 32px rgba(116,96,240,0.10);
      transform: translateY(-2px) scale(1.02);
    }

    .paragraph-card h3 {
      font-size: 1.25rem; 
      font-weight: 700;
      margin-bottom: 16px; 
    }
    
    .paragraph-card p {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #333;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 12; 
      line-clamp: 12;
      -webkit-box-orient: vertical;
    }
    
    .card-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #888;
      margin-top: 25px; 
      padding-top: 15px; 
      border-top: 1px solid var(--border-gray);
    }

    .cta-image-button {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      transition: transform 0.2s ease;
      z-index: 100; 
      max-width: 900px;
      line-height: 0;
    }
    

    .cta-image-button img {
      width: 100%; 
      height: auto;
      display: block; 
    }

  </style>
</head>
<body>

  <div class="page-wrapper">
    <header class="page-header">
      <h1>나의 문단들</h1>
      <a href="home.html" class="home-button">홈으로</a>
    </header>

    <nav class="category-nav">
      <a href="#" class="is-active">전체</a>
      <a href="#">학교 활동</a>
      <a href="#">동아리 활동</a>
      <a href="#">대외 활동</a>
      <a href="#">자기 계발</a>
      <a href="#">기타</a>
    </nav>

    <form class="search-bar">
      <input type="text" placeholder="검색어를 입력하세요">
      <button type="submit">🔍</button>
    </form>

    <main class="paragraph-grid" id="paragraph-grid">
      <!-- JS로 동적 렌더링 -->
    </main>
    <div id="modal-bg" style="display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.18);z-index:2000;"></div>
    <div id="edit-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,0.18);padding:44px 44px 36px 44px;z-index:2100;min-width:540px;max-width:540px;width:100%;">
      <h2 style="font-size:1.35rem;font-weight:700;margin-bottom:22px;">문단 편집</h2>
      <label style="font-weight:600;display:block;margin-bottom:10px;">제목<br>
        <input id="modal-title" type="text" style="width:100%;margin-top:6px;margin-bottom:18px;padding:10px 12px;border-radius:10px;border:1.5px solid #d1d1e0;font-size:1rem;background:#fafaff;font-family:'Pretendard','Noto Sans KR',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;">
      </label>
      <label style="font-weight:600;display:block;margin-bottom:10px;">내용<br>
        <textarea id="modal-content" rows="8" style="width:100%;margin-top:6px;margin-bottom:18px;padding:10px 12px;border-radius:10px;border:1.5px solid #d1d1e0;font-size:1rem;background:#fafaff;resize:vertical;font-family:'Pretendard','Noto Sans KR',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial;"></textarea>
      </label>
      <div style="display:flex;justify-content:flex-end;gap:16px;margin-top:18px;">
        <button id="modal-delete" style="background:#f44;color:#fff;border:none;padding:10px 28px;border-radius:10px;font-weight:600;font-size:1rem;">삭제</button>
        <button id="modal-cancel" style="background:#f5f5f7;color:#222;border:none;padding:10px 28px;border-radius:10px;font-weight:600;font-size:1rem;">취소</button>
        <button id="modal-save" style="background:#7460F0;color:#fff;border:none;padding:10px 28px;border-radius:10px;font-weight:600;font-size:1rem;">저장</button>
      </div>
      <button id="modal-close" style="position:absolute;top:22px;right:22px;background:none;border:none;font-size:1.7rem;color:#888;cursor:pointer;">&times;</button>
    </div>
  </div> <a href="chat.html" class="cta-image-button">
    <img src="images/chat_btn.png" alt="채팅하러 가기">
  </a>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 카테고리 네비게이션 활성화
      const navLinks = document.querySelectorAll('.category-nav a');
      navLinks.forEach(link => {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          navLinks.forEach(navLink => navLink.classList.remove('is-active'));
          event.currentTarget.classList.add('is-active');
        });
      });

      // 모달 관련 요소
      const modalBg = document.getElementById('modal-bg');
      const modal = document.getElementById('edit-modal');
      const modalTitle = document.getElementById('modal-title');
      const modalContent = document.getElementById('modal-content');
      const modalDelete = document.getElementById('modal-delete');
      const modalCancel = document.getElementById('modal-cancel');
      const modalSave = document.getElementById('modal-save');
      const modalClose = document.getElementById('modal-close');
      let currentParagraph = null;

      function openModal(paragraph) {
        currentParagraph = paragraph;
        modalTitle.value = paragraph.title;
        modalContent.value = paragraph.content;
        modal.style.display = 'block';
        modalBg.style.display = 'block';
      }
      function closeModal() {
        modal.style.display = 'none';
        modalBg.style.display = 'none';
        currentParagraph = null;
      }
      modalClose.onclick = modalCancel.onclick = closeModal;

      modalDelete.onclick = async () => {
        if (!currentParagraph) return;
        if (confirm('정말 삭제하시겠습니까?')) {
          await fetch(`/chats/api/paragraphs/${currentParagraph.id}/`, { method: 'DELETE' });
          closeModal();
          loadParagraphs();
        }
      };
      modalSave.onclick = async () => {
        if (!currentParagraph) return;
        await fetch(`/chats/api/paragraphs/${currentParagraph.id}/`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: modalTitle.value, content: modalContent.value })
        });
        closeModal();
        loadParagraphs();
      };

      // 문단 목록 동적 렌더링
      const grid = document.getElementById('paragraph-grid');
      function renderParagraphs(paragraphs) {
        grid.innerHTML = '';
        paragraphs.forEach(p => {
          const card = document.createElement('div');
          card.className = 'paragraph-card';
          card.innerHTML = `
            <div>
              <h3>${p.title}</h3>
              <p>${p.content}</p>
            </div>
            <div class="card-footer">
              <span>${p.created_at ? p.created_at.split('T')[0] : ''}</span>
              <span>${p.char_count || p.content.length}자</span>
            </div>
          `;
          card.onclick = () => openModal(p);
          grid.appendChild(card);
        });
      }

      let allParagraphs = [];
      async function loadParagraphs() {
        const res = await fetch('/chats/api/paragraphs/');
        allParagraphs = await res.json();
        renderParagraphs(allParagraphs);
      }
      loadParagraphs();

      // 검색 기능
      const searchInput = document.querySelector('.search-bar input');
      const searchForm = document.querySelector('.search-bar');
      searchForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const keyword = searchInput.value.trim().toLowerCase();
        if (!keyword) {
          renderParagraphs(allParagraphs);
          return;
        }
        const filtered = allParagraphs.filter(p =>
          p.title.toLowerCase().includes(keyword) ||
          p.content.toLowerCase().includes(keyword)
        );
        renderParagraphs(filtered);
      });
    });
  </script>
</body>
</html>
